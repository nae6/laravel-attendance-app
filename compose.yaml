services:
    nginx:
        build: ./docker/nginx
        ports:
            - "80:80"
        volumes:
            - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
            - ./src:/var/www/
        depends_on:
            - php

    php:
        build: ./docker/php
        volumes:
            - ./src:/var/www/

    mysql:
        build:
            context: .
            dockerfile: docker/mysql/Dockerfile
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: attendance_db
            MYSQL_USER: attendance_user
            MYSQL_PASSWORD: attendance_pass
        volumes:
            - db-data-mysql84:/var/lib/mysql
            - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
        ports:
            - "127.0.0.1:3306:3306"

    mailpit:
        image: axllent/mailpit:v1.33.1
        ports:
            - "127.0.0.1:8025:8025"
            - "127.0.0.1:1025:1025"

volumes:
    db-data-mysql84: